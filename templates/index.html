<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask POST Demo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card">
        <h1>Form Metode POST</h1>

        <form method="POST" action="/">
            <label for="nama_pengguna">Masukkan Nama:</label>
            <input
                type="text"
                id="nama_pengguna"
                name="nama_pengguna"
                placeholder="Contoh: Budi"
                required 
            >
            <button type="submit">Kirim</button>
        </form>

        {% if submitted_name %}
            <div class="result">
                <span class="result-label">Hasil Kiriman:</span>
                <p>Halo, <strong>{{ submitted_name }}</strong>! Data diterima melalui metode POST.</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
